[project]
name = "sklegal-workflow"
version = "0.1.0"
description = "Deterministic SKLegal task, deadline, reminder, and calendar primitives"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
