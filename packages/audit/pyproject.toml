[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sklegal-audit"
version = "0.1.0"
description = "SKLegal append-only audit, outbox, and protected telemetry"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "pydantic==2.13.4",
  "sklegal-capauth",
  "sklegal-policies",
]

[tool.setuptools.packages.find]
where = ["src"]
