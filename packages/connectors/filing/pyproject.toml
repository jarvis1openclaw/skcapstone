[project]
name = "sklegal-filing-connector"
version = "0.1.0"
description = "Simulation-first court filing connector"
requires-python = ">=3.12,<3.13"
dependencies = ["sklegal-connectors-base"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
