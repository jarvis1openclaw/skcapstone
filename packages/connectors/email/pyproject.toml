[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sklegal-email"
version = "0.1.0"
description = "Simulation-first approval-gated email connector"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = ["sklegal-connectors-base"]

[tool.setuptools.packages.find]
where = ["src"]
