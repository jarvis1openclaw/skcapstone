[project]
name = "sklegal-hammertime"
version = "0.1.0"
description = "Read-only HammerTime release and artifact adapter for SKLegal"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "sklegal-domain",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
