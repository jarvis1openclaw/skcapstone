[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sklegal-worker"
version = "0.1.0"
description = "SKLegal Temporal worker package boundary"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "pydantic==2.13.4",
  "sklegal-connectors-base",
  "sklegal-domain",
  "sklegal-email",
  "sklegal-model-gateway",
  "sklegal-retrieval",
  "temporalio==1.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
