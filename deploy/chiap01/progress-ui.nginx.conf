worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = / {
            return 302 /status/;
        }

        location /status/ {
            alias /srv/sklegal/status/;
            index index.html;
        }

        location = /approval/ARCHITECTURE-APPROVAL.md {
            alias /srv/sklegal/evidence/architecture-approval.md;
            default_type text/markdown;
        }

        location = /tasks/SUBAGENT-TASK-TTDS.md {
            alias /srv/sklegal/evidence/task-tdds.md;
            default_type text/markdown;
        }

        location = /planning/EPIC-SPRINT-PLAN.md {
            alias /srv/sklegal/evidence/original-sprint-plan.md;
            default_type text/markdown;
        }

        location = /planning/UI-FIRST-EXECUTION-PLAN.md {
            alias /srv/sklegal/evidence/ui-first-plan.md;
            default_type text/markdown;
        }
    }
}
