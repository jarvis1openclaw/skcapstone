name: sklegal-dev

services:
  postgres:
    image: postgres:17.7-alpine@sha256:a6d31f853205ce20d399df4e33a0b4c715672f232f4ee7440499747e6e02c126
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - sklegal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.1@sha256:efdd7aa92c93ad69ec803b2bd1bb75a8abbbe129af0df4eab4bb039422da618e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ""
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:17233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  sklegal-postgres-data:
    name: sklegal-dev-postgres-data
