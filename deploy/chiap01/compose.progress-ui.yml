name: sklegal-progress-ui

services:
  progress-ui:
    image: nginx:1.29.6-alpine@sha256:08fe94b0d1e72fc687840f5696f6e107a85c327b1bcb8a7acc22f8c100227c67
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:15174:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - ./progress-ui.nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../docs/status:/srv/sklegal/status:ro
      - ../../docs/approval/ARCHITECTURE-APPROVAL.md:/srv/sklegal/evidence/architecture-approval.md:ro
      - ../../docs/tasks/SUBAGENT-TASK-TTDS.md:/srv/sklegal/evidence/task-tdds.md:ro
      - ../../docs/planning/EPIC-SPRINT-PLAN.md:/srv/sklegal/evidence/original-sprint-plan.md:ro
      - ../../docs/planning/UI-FIRST-EXECUTION-PLAN.md:/srv/sklegal/evidence/ui-first-plan.md:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/status/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 3s
